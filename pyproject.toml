[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-plus-lists"
version = "0.1.7"
description = "Groups, tags, custom fields and assignments for existing Home Assistant lists"
requires-python = ">=3.13"

[project.optional-dependencies]
test = ["pytest-homeassistant-custom-component==0.13.204", "home-assistant-frontend==20250109.0", "pycares==4.5.0", "ical==8.2.0", "pyparsing==3.2.1", "python-dateutil==2.9.0.post0", "ruff"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.lists_plus" = ["*.json", "*.yaml", "frontend/*.js", "frontend/ha-plus-ui.*", "translations/*.json", "brand/*.png", "brand/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
